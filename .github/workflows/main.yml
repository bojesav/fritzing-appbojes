name: Build Fritzing for Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        target: desktop
        arch: win64_msvc2019_64
        tools: tools_qtcreator,qt.tools.qtcreator

    - name: Install dependencies
      run: |
        choco install -y cmake ninja strawberryperl git
        git submodule update --init --recursive

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Ninja" -DCMAKE_PREFIX_PATH="%Qt5_DIR%" -DCMAKE_BUILD_TYPE=Release

    - name: Build Fritzing
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload .exe as artifact
      uses: actions/upload-artifact@v3
      with:
        name: fritzing-windows
        path: build/Release/Fritzing.exe
